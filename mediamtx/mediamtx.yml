logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

metrics: no
pprof: no

authMethod: http
authHTTPAddress: http://api:3000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

rtsp: no
rtmp: no
hls: no

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
# MediaMTX 1.12.x uses singular webrtcAllowOrigin (list form is newer only)
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

pathDefaults:
  source: publisher

paths:
  all_others:
