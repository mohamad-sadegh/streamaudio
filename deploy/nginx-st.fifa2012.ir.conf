# Place on the HOST (aaPanel / nginx / etc.) that already owns :80/:443.
# Copy to e.g. /etc/nginx/sites-available/st.fifa2012.ir.conf and enable it.
#
# Docker must publish:
#   127.0.0.1:8080 -> admin
#   127.0.0.1:3000 -> api
#   127.0.0.1:8889 -> mediamtx WHIP/WHEP
#   8189/udp+tcp   -> WebRTC media

upstream streamaudio_admin {
    server 127.0.0.1:8080;
}

upstream streamaudio_api {
    server 127.0.0.1:3000;
}

upstream streamaudio_mtx {
    server 127.0.0.1:8889;
}

server {
    listen 80;
    listen [::]:80;
    server_name st.fifa2012.ir;

    # Keep your existing certbot / panel SSL — or redirect to HTTPS:
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name st.fifa2012.ir;

    # --- use your real certificate paths (aaPanel/certbot) ---
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://streamaudio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # MediaMTX WHIP/WHEP (paths like /live/{id}/whip)
    location /live/ {
        proxy_pass http://streamaudio_mtx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://streamaudio_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
