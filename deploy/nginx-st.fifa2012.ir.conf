# Host nginx / aaPanel that already owns :80/:443.
# Copy into sites-available (or panel vhost) and enable.
#
# StreamAudio must be up with localhost ports:
#   127.0.0.1:8080 -> admin
#   127.0.0.1:3000 -> api
#   127.0.0.1:8889 -> mediamtx WHIP/WHEP
#   8189/udp+tcp   -> WebRTC media
#
# Critical: location /api/ MUST proxy to 127.0.0.1:3000 or login returns 502.

upstream streamaudio_admin {
    server 127.0.0.1:8080;
}

upstream streamaudio_api {
    server 127.0.0.1:3000;
}

upstream streamaudio_mtx {
    server 127.0.0.1:8889;
}

server {
    listen 80;
    listen [::]:80;
    server_name st.fifa2012.ir;
    return 301 https://$host$request_uri;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name st.fifa2012.ir;

    # --- use your real certificate paths (aaPanel/certbot) ---
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 20m;

    # Device control WebSocket: /api/device/ws (Upgrade headers required)
    location /api/ {
        proxy_pass http://streamaudio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /live/ {
        proxy_pass http://streamaudio_mtx;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://streamaudio_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
