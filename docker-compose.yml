services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "3000"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      ADMIN_LOGIN_IP_ALLOWLIST: ${ADMIN_LOGIN_IP_ALLOWLIST:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DOMAIN: ${DOMAIN}
      MEDIAMTX_API_URL: http://mediamtx:9997
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - internal

  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOSTS}
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  admin:
    build: ./admin
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started
      mediamtx:
        condition: service_started
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
